services:
  postgres:
    image: postgres:19-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_PG_USER}
      POSTGRES_PASSWORD: ${DB_PG_PASS}
      POSTGRES_DB: ${DB_PG_DBNAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_PG_USER} -d ${DB_PG_DBNAME}"]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
      - postgres

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:6.19
    depends_on:
      - postgres
    environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - ${PGADMIN_PORT}:80
    networks:
      - postgres
    restart: unless-stopped

volumes:
    pgdata:
    pgadmin:

networks:
    postgres:
        driver: bridge
