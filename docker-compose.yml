services:
  postgres:
    image: postgres:19-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_PG_USER}
      POSTGRES_PASSWORD: ${DB_PG_PASS}
      POSTGRES_DB: ${DB_PG_DBNAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_PG_USER} -d ${DB_PG_DBNAME}"]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
      - db_network

volumes:
    pgdata:

networks:
    db_network:
        driver: bridge
